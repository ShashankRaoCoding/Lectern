<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lectern{% endblock %}</title>
  <style>
    :root { --bg:#fafaf7; --fg:#1c1c1a; --muted:#6b6b66; --accent:#2f6f4f; --card:#fff; --line:#e3e2dc; --danger:#a33; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#161815; --fg:#e8e8e3; --muted:#9a9a93; --accent:#6fbf94; --card:#1f221e; --line:#33362f; --danger:#e07a7a; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, sans-serif; }
    a { color:var(--accent); }
    header { border-bottom:1px solid var(--line); background:var(--card); }
    header nav { max-width:900px; margin:0 auto; padding:.75rem 1rem; display:flex; gap:1rem; align-items:center; }
    header nav .spacer { flex:1; }
    header nav form { margin:0; }
    main { max-width:900px; margin:0 auto; padding:1.5rem 1rem 4rem; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:1rem 1.25rem; margin-bottom:.75rem; }
    .row { display:flex; gap:.75rem; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    .btn, button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:.5rem .9rem; font:inherit; cursor:pointer; text-decoration:none; display:inline-block; }
    .btn.secondary, button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
    button.danger { background:transparent; color:var(--danger); border:1px solid var(--danger); }
    input[type=text], input[type=password], input[type=file], select, textarea { width:100%; padding:.5rem; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); font:inherit; }
    textarea { font-family: ui-monospace, monospace; font-size:.95rem; }
    label { display:block; font-weight:600; margin:.75rem 0 .25rem; }
    .help, .muted { color:var(--muted); font-size:.9rem; }
    .errorlist { color:var(--danger); list-style:none; padding:0; margin:.25rem 0; }
    .msg { padding:.6rem .9rem; border-radius:8px; margin-bottom:.75rem; border:1px solid var(--line); background:var(--card); }
    .msg.error { border-color:var(--danger); color:var(--danger); }
    .msg.success { border-color:var(--accent); }
    .prose { font-family: Georgia, 'Times New Roman', serif; font-size:1.05rem; line-height:1.7; }
    .prose h1, .prose h2, .prose h3 { font-family: system-ui, sans-serif; line-height:1.25; }
    .prose table { border-collapse:collapse; margin:1rem 0; }
    .prose th, .prose td { border:1px solid var(--line); padding:.35rem .6rem; }
    .prose pre { overflow:auto; background:var(--card); border:1px solid var(--line); padding:.75rem; border-radius:8px; }
    .prose .math-display { overflow-x:auto; overflow-y:hidden; margin:1rem 0; }
    pre.mermaid { background:transparent; border:0; text-align:center; }
    hr.sep { border:0; border-top:1px solid var(--line); margin:2.5rem 0; }
  </style>
</head>
<body>
<header>
  <nav>
    <strong><a href="{% url 'textbook_list' %}" style="text-decoration:none">Lectern</a></strong>
    {% if user.is_authenticated %}
      <a href="{% url 'textbook_list' %}">Textbooks</a>
      <a href="{% url 'preferences' %}">Preferences</a>
      <span class="spacer"></span>
      <span class="muted">{{ user.get_username }}</span>
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="secondary" type="submit">Log out</button></form>
    {% else %}
      <span class="spacer"></span>
      <a href="{% url 'login' %}">Log in</a>
      <a class="btn" href="{% url 'signup' %}">Sign up</a>
    {% endif %}
  </nav>
</header>
<main>
  {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
